name: Build Windows EXE
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --onefile --windowed --name Seismic2800 --icon icon.ico --add-data "app;app" app.py
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Seismic2800-Windows
          path: |
            dist/Seismic2800.exe
            Output/Seismic2800_Setup.exe
